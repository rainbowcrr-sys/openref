name: Build and Deploy to Cloudflare Workers

# ============================================================
# 全自动部署流程（方式 A）
#
# 你 push 之后，这个 workflow 自动做三件事：
#   1) 构建站点：node build.mjs → 生成 dist/
#   2) 打包备份：把 dist/ 打成 openref-dist.zip 存为构建产物（可下载查看）
#   3) 自动上传：wrangler deploy 推到 Cloudflare Workers
#
# 全程 1-3 分钟，你不需要下载任何东西，也不需要开电脑。
#
# 【可选的刹车】
# 如果你临时不想自动部署：
#   仓库 Settings → Secrets and variables → Actions → Variables
#   新建变量 AUTO_DEPLOY，值填 false
# 变量不存在、或填其他任何值，都会正常自动部署。
#
# 需要的 Secrets（一次性配置）：
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
# ============================================================

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 判断仓库里有没有已经构建好的 dist/
      - name: Detect committed dist
        id: mode
        run: |
          if [ -f dist/index.html ]; then
            echo "value=upload" >> "$GITHUB_OUTPUT"
            echo "检测到仓库中已有 dist/，直接使用"
          else
            echo "value=build" >> "$GITHUB_OUTPUT"
            echo "仓库无 dist/，改为云端构建"
          fi

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.value == 'build'
        with:
          node-version: '20'

      - name: Build
        if: steps.mode.outputs.value == 'build'
        run: node build.mjs

      # 打包成 zip（仅作备份和可下载查看，不用于部署）
      - name: Package dist
        run: |
          cd dist
          zip -r ../openref-dist.zip .
          cd ..
          echo "文件数：$(find dist -type f | wc -l)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openref-dist
          path: openref-dist.zip
          retention-days: 90

      # 核心：自动部署到 Cloudflare Workers
      # 只有变量 AUTO_DEPLOY 明确等于 false 时才跳过
      - name: Deploy to Cloudflare Workers
        if: vars.AUTO_DEPLOY != 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Summary
        run: |
          if [ "${{ vars.AUTO_DEPLOY }}" = "false" ]; then
            echo "⚠️ AUTO_DEPLOY=false，本次只构建未部署"
          else
            echo "✅ 已自动部署到 Cloudflare Workers"
          fi
