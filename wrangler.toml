# ============================================================
# Cloudflare Workers 静态资源托管配置
#
# 【关键】这个文件故意不写 main 字段。
# 不写 main = 没有 Worker 脚本 = 每个请求都直接返回静态文件
#            = 免费、无限、不受 Workers 免费版 10 万次/天限制
# 一旦加了 main（哪怕是空转发），所有请求都会先跑 Worker 脚本，
# 就会开始消耗 10 万次/天的额度。别加。
# ============================================================

name = "openref"

# 兼容日期，保持不动即可
compatibility_date = "2026-10-29"

[assets]
# 构建产物目录，node build.mjs 的输出位置
directory = "./dist"

# 找不到文件时，返回最近的 404.html
# 就是那个每 7 秒快闪 3 次的页面
not_found_handling = "404-page"
